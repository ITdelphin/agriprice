<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#142B4A">
    <meta name="description" content="Sign in to the AgriPrice Rwanda agent workspace.">
    <title>Agent sign in | AgriPrice Rwanda</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.login-only { min-height: 100vh; display: block !important; background: var(--beige); }
        body.login-only .login-main { width: min(420px, calc(100% - 32px)); min-height: 0; display: block; margin: 8vh auto; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
        .login-only-card { padding: 32px; border: 1px solid var(--border-color); border-radius: 14px; background: var(--white); box-shadow: 0 12px 30px rgba(20,43,74,.08); }
        .login-only-card h1 { margin: 0 0 24px; color: var(--navy); font-size: 26px; letter-spacing: -.8px; }
        body.login-only .login-form { display: grid; gap: 16px; margin: 0; }
        body.login-only .login-field label { color: var(--navy); font-size: 12px; font-weight: 700; }
        body.login-only .login-field input { min-height: 46px; padding: 0 12px; border: 1px solid var(--border-color); border-radius: 9px; background: var(--white); color: var(--navy); font-size: 13px; }
        body.login-only .login-field input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(20,43,74,.10); outline: none; }
        body.login-only .login-password-label { display: block; }
        body.login-only .login-password-input { position: relative; }
        body.login-only .login-password-input input { padding-right: 64px; }
        body.login-only .login-password-input button { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); border: 0; background: transparent; color: var(--navy); font-size: 11px; font-weight: 700; cursor: pointer; }
        body.login-only .login-forgot-link { margin: 8px 0 0; text-align: right; }
        body.login-only .login-forgot-link a { color: var(--navy); font-size: 11px; font-weight: 700; text-decoration: none; }
        body.login-only .login-submit { width: 100%; min-height: 46px; margin: 4px 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 9px; background: var(--navy); color: var(--white); font-size: 13px; font-weight: 700; cursor: pointer; }
        body.login-only .login-submit:hover { background: var(--army-green); }
        body.login-only .login-submit:disabled { opacity: .7; cursor: wait; }
        body.login-only .login-feedback { margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; font-size: 12px; }
        body.login-only .login-feedback.is-error { border: 1px solid var(--red); background: var(--red-soft); color: var(--red); }
        body.login-only .login-feedback.is-success { border: 1px solid var(--army-green); background: var(--army-soft); color: var(--army-green); }
        @media (max-width: 480px) {
            body.login-only .login-main { margin-top: 4vh; }
            .login-only-card { padding: 24px 20px; }
        }
    </style>
</head>
<body class="login-page login-only">
    <main class="login-main">
        <section class="login-only-card" aria-labelledby="loginTitle">
            <h1 id="loginTitle">Agent sign in</h1>
            <div id="loginFeedback" class="login-feedback" style="display:none" role="status" aria-live="polite"></div>
            <form id="loginForm" class="login-form">
                <div class="login-field">
                    <label for="agentEmail">Work email</label>
                    <input type="email" id="agentEmail" name="email" placeholder="name@example.com" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                </div>
                <div class="login-field">
                    <div class="login-password-label"><label for="agentPassword">Password</label></div>
                    <div class="login-password-input">
                        <input type="password" id="agentPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                    <p class="login-forgot-link"><a href="forgot-password.html">Forgot password?</a></p>
                </div>
                <button type="submit" id="btnLoginSubmit" class="login-submit"><span>Sign in to continue</span><span aria-hidden="true">→</span></button>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/site-shell.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const feedback = document.getElementById('loginFeedback');
            const submit = document.getElementById('btnLoginSubmit');
            const emailInput = document.getElementById('agentEmail');
            const passwordInput = document.getElementById('agentPassword');

            document.getElementById('togglePassword').addEventListener('click', event => {
                const visible = passwordInput.type === 'password';
                passwordInput.type = visible ? 'text' : 'password';
                event.currentTarget.textContent = visible ? 'Hide' : 'Show';
                event.currentTarget.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
                event.currentTarget.setAttribute('aria-pressed', String(visible));
            });

            form.addEventListener('submit', async event => {
                event.preventDefault();
                if (!form.reportValidity()) return;
                feedback.style.display = 'none';
                submit.disabled = true;
                submit.setAttribute('aria-busy', 'true');
                submit.querySelector('span').textContent = 'Signing in…';
                try {
                    const response = await AgriAPI.login(emailInput.value.trim(), passwordInput.value);
                    if (response.status === 200 && response.data.success) {
                        feedback.className = 'login-feedback is-success';
                        feedback.textContent = `Welcome, ${response.data.fullName}. Opening your workspace…`;
                        feedback.style.display = 'block';
                        window.setTimeout(() => { window.location.href = 'dashboard.html'; }, 700);
                    } else {
                        showLoginError(response.data.message || 'That email or password doesn’t match. Please try again.');
                    }
                } catch (_) {
                    showLoginError('We couldn’t connect to sign-in. Check your connection and try again.');
                }
            });

            function showLoginError(message) {
                feedback.className = 'login-feedback is-error';
                feedback.textContent = message;
                feedback.style.display = 'block';
                submit.disabled = false;
                submit.removeAttribute('aria-busy');
                submit.querySelector('span').textContent = 'Sign in to continue';
            }
        });
    </script>
</body>
</html>
