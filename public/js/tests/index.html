<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="../../assets/images/logo.svg" type="image/svg+xml">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgriPrice Rwanda — QUnit Automated Test Suite</title>
    <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.20.0.css">
    <style>
        :root { --sky-blue:#87CEEB; --army-green:#4B5320; --beige:#F5F0E6; --navy:#142B4A; --white:#FFFFFF; --red:#DC2626; --black:#171717; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--beige); color: var(--black); padding: 0 12px 24px; }
        .test-header-banner { background:var(--navy); color: var(--white); padding: 20px; border-radius: 14px; margin: 15px auto; max-width: 900px; border-left: 6px solid var(--sky-blue); box-shadow: 0 8px 24px rgba(20,43,74,.18); }
        .test-header-banner h1 { margin: 0 0 8px 0; font-size: 1.5rem; color: var(--white); }
        .test-header-banner p { margin: 0; font-size: 0.9rem; opacity: 0.9; }
        #qunit { max-width: 900px; margin: 0 auto; }
        #qunit-tests li.pass { border-left-color: var(--army-green); }
        #qunit-tests li.fail { border-left-color: var(--red); }
    </style>
</head>
<body>
    <div class="test-header-banner">
        <h1>AgriPrice Rwanda — Automated Test Suite &amp; TDD Evidence</h1>
        <p>Final Assessment Test (FAT) &bull; QUnit 2.20 &bull; Rubavu &amp; Gisenyi Agricultural Pricing Logic</p>
    </div>

    <div id="qunit"></div>
    <div id="qunit-fixture"></div>

    <!-- QUnit Framework -->
    <script src="https://code.jquery.com/qunit/qunit-2.20.0.js"></script>

    <!-- Source Modules to Test -->
    <script src="../watchlist-model.js"></script>
    <script src="../pricing-rules.js"></script>

    <!-- Test Specifications -->
    <script src="agriprice-tests.js"></script>
</body>
</html>
